# Runtime config template. In production this lives in %LOCALAPPDATA%\squad\.
allowed_providers:
  - openrouter

roles:
  planner: strong
  coder: strong
  reviewer: worker

budget:
  mode: balanced
  per_call:
    max_input_tokens: 32000
    max_output_tokens: 4000
  per_task_usd: 5.00
  per_day_usd: 20.00
  per_month_usd: 200.00

crew:
  size: 5
  max_agents: 10
  max_running: 1
  names: [Captain, Ironman, Tester, Batman, Quality]

repos:
  practice:
    root: practice/
    source_paths: ["src/"]
    test_paths: ["tests/"]
    check_commands:
      test: "pytest -q"
      lint: "ruff check ."
      typecheck: "python -m mypy ."